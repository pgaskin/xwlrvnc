[package]
name = "xwlrvnc"
version = "0.0.3"
edition = "2024"
license = "MIT"
description = "Fake X server backed by a Wayland display, implementing just enough for RealVNC to work on it"
keywords = ["remote-desktop","server","wayland","x11","vnc"]
categories = ["command-line-utilities"]
repository = "https://github.com/pgaskin/xwlrvnc"

[dependencies]
nix = { version = "0.30", features = ["fs"] }
wayland-client = "0.31.14"
wayland-protocols = { version = "0.32.12", features = ["client", "staging", "unstable"] }
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
x11rb-protocol = { version = "0.13.2", features = [
    "request-parsing",
    "xtest",
    "randr",
    "damage",
    "xfixes",
    "shm",
] }
xkbcommon-rs = { version = "0.1.2", features = ["client", "server"] }

# Keep debug symbols in release builds so sampling profilers (samply, perf)
# resolve our frames. No runtime cost; just a larger binary.
[profile.release]
debug = true

[workspace]
exclude = ["dynres"] # can't do the profile options otherwise
